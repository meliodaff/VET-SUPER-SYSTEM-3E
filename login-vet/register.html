<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/register.css">
</head>
<body>
  <div class="container">
    <img class="register-img" src="Image/register-img.png" alt="">

        <div class="register-bg">

        <div class="register-form">
          <h1 class="title">Fur-Ever Care</h1>
          <p class="subtitle">Join our Pet Family!</p>

          <form action="">

            <!--first and last name-->
            <div class="name-inputs">
              <input type="text" placeholder="First Name">
              <input type="text" placeholder="Last Name">
            </div>

            <!--Email address-->
            <input class="email" type="text" placeholder="Email Address">
              
            <!--Create password-->
            <div class="password">
              <input class="password-field" type="password" placeholder="Create Password">
              <button class="eye-button">
                <img class="eye-image" src="Image/Eye off.png" alt="">
              </button>
            </div>

            <!--confirm password-->
            <div class="password">
              <input class="password-field" type="password" placeholder="Confirm Password">
              <button class="eye-button">
                <img class="eye-image" src="Image/Eye off.png" alt="">
              </button>
            </div>
            <div class="terms-and-privacy">
              <input type="checkbox"><p class="terms-and-privacy-p">I agree to the <a href="" class="terms-link">Terms</a> and <a href="" class="privacy-policy-link">Privacy Policy</a></p>
            </div>

            <button class="register-button">REGISTER</button>
          </form>

        
          <p class="login">Already have an account?<a class="login-link" href=""> Log in</a></p>
           <img class="heart" src="Image/heart.png" alt="">
      </div>
    </div>
  </div>
</body>
</html>
