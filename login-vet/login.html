<!DOCTYPE html>
<html>
<head>
  <title>login</title>

  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/login.css">


</head>
<body>

  <div class="container">
    <img class="login-img" src="Image/login-img.jpg" alt="">

    <div class="login-bg">

      <div class="login-form">
          <h1 class="title">Fur-Ever Care</h1>
          <p class="subtitle">Welcome Back!</p>

          <form action="">
            <input class="email" type="text" name="" id="" placeholder="Email Address">
            <div class="password">
              <input class="password-field" type="password" placeholder="Password">
              <button class="eye-button">
                <img class="eye-image" src="Image/Eye off.png" alt="">
              </button>
            </div>
            <a class="forget-link" href="">Forget Password?</a>
            <button class="login-button">LOG IN</button>
          </form>

        
            <p class="register">Don't have an account?<a class="register-link" href="">Register</a></p>
            <img class="heart" src="Image/heart.png" alt="">
      </div>
    </div>
  </div>
</body>
</html>
